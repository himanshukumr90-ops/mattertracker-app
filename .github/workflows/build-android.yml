name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      # Debug APK — for direct device installs / testing
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mattertracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Signed release AAB — what gets uploaded to Google Play.
      # Signing material comes from repo secrets; if they aren't set,
      # this step is skipped and the workflow still succeeds.
      - name: Decode upload keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload-keystore.p12
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build signed release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: cd android && ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mattertracker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
